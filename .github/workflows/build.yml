name: Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to build (leave empty to build all)"
        required: false
        default: "all"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks
      ksu:
        description: "Include SukiSU-Nova (KernelSU)"
        required: false
        default: true
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.matrix.outputs.models }}
    steps:
      - name: Select models
        id: matrix
        run: |
          MODEL="${{ github.event.inputs.model }}"
          if [ -z "$MODEL" ] || [ "$MODEL" = "all" ]; then
            echo 'models=["d1","d1xks","d2s","d2x","d2xks"]' >> "$GITHUB_OUTPUT"
          else
            echo "models=[\"$MODEL\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.setup.outputs.models) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison bc build-essential zip unzip curl \
            zstd cpio lz4 libssl-dev libelf-dev zlib1g-dev libxml2-utils xsltproc fontconfig

      # Same toolchain as SM-A226B-SukiSU-Ultra-Kernel:
      # AOSP clang-r383902 + AArch64 GCC 4.9 binutils (ci/fetch_toolchain.sh)
      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            toolchain/clang
            toolchain/gcc
          key: toolchain-${{ hashFiles('ci/fetch_toolchain.sh') }}

      - name: Fetch toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: bash ci/fetch_toolchain.sh

      - name: Build for ${{ matrix.model }}
        run: |
          KSU=n
          if [ "${{ github.event.inputs.ksu }}" != "false" ]; then KSU=y; fi
          bash ./workflows.sh -m ${{ matrix.model }} -k $KSU -r N 2>&1 | tee build-${{ matrix.model }}.log
          exit ${PIPESTATUS[0]}

      - name: Show SukiSU-Nova version
        if: always()
        run: grep -E "SukiSU-Nova version|KERNEL_TYPE" build-${{ matrix.model }}.log || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-${{ matrix.model }}
          path: build/out/${{ matrix.model }}/zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.model }}
          path: build-${{ matrix.model }}.log
