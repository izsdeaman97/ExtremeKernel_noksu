name: Kernel Build Workflow

on:
  push:
    branches: [ ccr-48d3cc47-snwzwj ]
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      model:
        description: "Model to build (leave empty to build all)"
        required: false
        default: "all"
        type: choice
        options:
        - all
        - d1
        - d1xks
        - d2s
        - d2x
        - d2xks
      ksu:
        description: "Include SukiSU-Nova (KernelSU)"
        required: false
        default: true
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.matrix.outputs.models }}
    steps:
      - name: Select models
        id: matrix
        run: |
          MODEL="${{ github.event.inputs.model }}"
          if [ -z "$MODEL" ] || [ "$MODEL" = "all" ]; then
            echo 'models=["d1","d1xks","d2s","d2x","d2xks"]' >> "$GITHUB_OUTPUT"
          else
            echo "models=[\"$MODEL\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    # Neutron's ld.lld links against libxml2.so.2, which newer Ubuntu
    # images no longer ship; pin the runner image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.setup.outputs.models) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison bc build-essential zip unzip curl \
            zstd cpio lz4 libssl-dev libelf-dev zlib1g-dev libxml2 libxml2-utils xsltproc fontconfig

      - name: Cache Neutron toolchain
        uses: actions/cache@v4
        with:
          # antman --patch=glibc points the binaries at ~/.neutron-tc/glibc,
          # so that directory has to be cached together with the toolchain.
          path: |
            toolchain/neutron_18
            ~/.neutron-tc
          key: neutron-clang-05012024-glibc-${{ runner.os }}-v2

      - name: Build for ${{ matrix.model }}
        run: |
          KSU=n
          if [ "${{ github.event.inputs.ksu }}" != "false" ]; then KSU=y; fi
          bash ./workflows.sh -m ${{ matrix.model }} -k $KSU -r N 2>&1 | tee build-${{ matrix.model }}.log
          exit ${PIPESTATUS[0]}

      - name: Show SukiSU-Nova version
        if: always()
        run: grep -E "SukiSU-Nova version|KERNEL_TYPE" build-${{ matrix.model }}.log || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-${{ matrix.model }}
          path: build/out/${{ matrix.model }}/zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.model }}
          path: build-${{ matrix.model }}.log

  # On a v* tag: gather every model's AnyKernel3 output and publish a GitHub
  # Release with one flashable zip per model.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Repack flashable zips
        run: |
          set -e
          mkdir -p release
          for d in artifacts/ExtremeKRNL-Nexus-*; do
            [ -d "$d" ] || continue
            m="$(basename "$d")"; m="${m#ExtremeKRNL-Nexus-}"
            ( cd "$d" && zip -r -X "$GITHUB_WORKSPACE/release/ExtremeKRNL-Nexus-$m.zip" . >/dev/null )
          done
          ( cd release && sha256sum *.zip | tee SHA256SUMS.txt )
          ls -la release

      - name: Write release notes
        run: |
          cat > release/NOTES.md <<'NOTE'
          ExtremeKernel_noksu — SukiSU-Nova kernel for Samsung (Exynos 9825)

          Flashable AnyKernel3 zips, one per model (d1, d1xks, d2s, d2x, d2xks).
          Verified booting on **d2xks (Note10+)**; other models build-only.

          **Included**
          - SukiSU-Nova (KernelSU) builtin@4bec532d — KSU_VERSION 30007
          - SUSFS v2.4.0
          - NoMount v2.3.0
          - SELinux query filter + built-in selinux_hook (DirtySepolicy hiding)

          **Before flashing:** back up boot/dtb/dtbo. On a logo hang, restore your
          backup; if a manager *module* bootloops (not the kernel), enter SukiSU
          safe mode (power on, press Volume Up 3–5 times).

          See docs/REPO-MASTER.md (VI) / docs/REPO-MASTER.en.md (EN).
          NOTE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/ExtremeKRNL-Nexus-*.zip release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ExtremeKernel d2xks ${GITHUB_REF_NAME}" \
            --notes-file release/NOTES.md
